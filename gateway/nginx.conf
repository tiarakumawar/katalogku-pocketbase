# API Gateway: satu pintu masuk untuk semua service
server {
  listen 80;
  client_max_body_size 5m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location = /api/health {
    default_type application/json;
    return 200 '{"gateway":"ok"}';
  }

  # product-service (PocketBase #1): koleksi products
  location /api/products {
    proxy_pass http://product-service:8090/api/collections/products/records;
  }

  # account-service (PocketBase #2): akun & favorit
  location /api/auth/ {
    proxy_pass http://account-service:8090/api/collections/users/;
  }
  location /api/favorites {
    proxy_pass http://account-service:8090/api/collections/favorites/records;
  }

  # review-service (PocketBase #3): rating & komentar
  # GET boleh tanpa login. POST/PATCH/DELETE wajib token login yang valid:
  # gateway menanyakan dulu ke account-service lewat /_auth_check.
  location /api/reviews {
    auth_request /_auth_check;
    proxy_pass http://review-service:8090/api/collections/reviews/records;
  }

  location = /_auth_check {
    internal;
    if ($request_method = GET) {
      return 204;
    }
    proxy_method POST;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_pass http://account-service:8090/api/collections/users/auth-refresh;
  }
}
